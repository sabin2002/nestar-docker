services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend/nestar
    environment:
      NODE_ENV: development
      PORT_API: "3000"
      MONGO_DEV: mongodb://mongo:27017/nestar
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3007:3007"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/nestar-next
    environment:
      REACT_APP_API_URL: http://localhost:3000
      REACT_APP_API_GRAPHQL_URL: http://localhost:3000/graphql
      REACT_APP_API_WS: ws://localhost:3007
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
