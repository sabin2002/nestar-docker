# Nestar — microservices stack for local development
#
#   frontend (Next.js) ──HTTP/GraphQL + WebSocket──▶ api-gateway (nestar-api)
#                                                     │  TCP (NestJS microservices)
#        ┌──────────────┬───────────────┬─────────────┼──────────────┬──────────────┐
#   member-service  property-service  community-service  social-service  ai-service ──▶ ollama
#        └──────────────┴───────────────┴──────────────────────┘
#                         mongo (one database per service)
#   batch (scheduler) ──TCP──▶ property-service, member-service
#
# Settings can be overridden in a .env file next to this file (see .env.example).

x-backend: &backend
  build:
    context: ./backend/nestar
  image: nestar-backend:dev
  restart: unless-stopped
  networks:
    - nestar-network
  environment: &backend-env
    NODE_ENV: development
    MONGO_DEV: mongodb://mongo:27017/nestar
    SECRET_TOKEN: ${SECRET_TOKEN:-nestar-dev-secret-change-me}
    MEMBER_SERVICE_HOST: member-service
    PROPERTY_SERVICE_HOST: property-service
    COMMUNITY_SERVICE_HOST: community-service
    SOCIAL_SERVICE_HOST: social-service
    AI_SERVICE_HOST: ai-service

services:
  mongo:
    image: mongo:8.0
    networks:
      - nestar-network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- AI (local LLM) ----------
  ollama:
    image: ollama/ollama:latest
    networks:
      - nestar-network
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    # NVIDIA GPU (optional, much faster). Uncomment if Docker Desktop has GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Downloads the model once (about 2 GB for llama3.2), then exits.
  ollama-pull:
    image: ollama/ollama:latest
    networks:
      - nestar-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2}"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  # ---------- microservices (TCP, not published to the host) ----------
  member-service:
    <<: *backend
    command: ["node", "dist/apps/member-service/main"]
    depends_on:
      mongo:
        condition: service_healthy

  property-service:
    <<: *backend
    command: ["node", "dist/apps/property-service/main"]
    depends_on:
      mongo:
        condition: service_healthy

  community-service:
    <<: *backend
    command: ["node", "dist/apps/community-service/main"]
    depends_on:
      mongo:
        condition: service_healthy

  social-service:
    <<: *backend
    command: ["node", "dist/apps/social-service/main"]
    depends_on:
      mongo:
        condition: service_healthy

  ai-service:
    <<: *backend
    command: ["node", "dist/apps/ai-service/main"]
    environment:
      <<: *backend-env
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on:
      - ollama
      - property-service

  batch:
    <<: *backend
    command: ["node", "dist/apps/nestar-batch/main"]
    environment:
      <<: *backend-env
      PORT_BATCH: "3008"
    depends_on:
      - member-service
      - property-service

  # ---------- edge ----------
  api-gateway:
    <<: *backend
    command: ["node", "dist/apps/nestar-api/main"]
    environment:
      <<: *backend-env
      PORT_API: "3000"
    ports:
      - "127.0.0.1:3000:3000" # GraphQL, /uploads and the WebSocket chat share this port
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - member-service
      - property-service
      - community-service
      - social-service
      - ai-service

  frontend:
    build:
      context: ./frontend/nestar-next
    environment:
      REACT_APP_API_URL: http://localhost:3000
      REACT_APP_API_GRAPHQL_URL: http://localhost:3000/graphql
      REACT_APP_API_WS: ws://localhost:3000
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - nestar-network
    depends_on:
      - api-gateway

networks:
  nestar-network:
    name: nestar-network
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
  ollama_data:
